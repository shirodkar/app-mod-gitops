apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openbao
  project: default
  sources:
    - repoURL: 'https://openbao.github.io/openbao-helm'
      chart: openbao
      targetRevision: 0.28.3
      helm:
        releaseName: openbao
        valuesObject:
          global:
            openshift: true
          injector:
            enabled: false
          server:
            standalone:
              enabled: true
              config: |
                ui = true
                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                }
                storage "file" {
                  path = "/openbao/data"
                }
            readinessProbe:
              path: "/v1/sys/health?standbyok=1&sealedcode=200&uninitcode=200"
            authDelegator:
              enabled: true
            dataStorage:
              enabled: true
              size: 1Gi
          ui:
            enabled: true
    - repoURL: 'https://github.com/shirodkar/app-mod-gitops.git'
      targetRevision: HEAD
      path: manifests/plain/openbao
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
