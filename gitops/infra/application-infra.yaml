apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openbao
  project: default
  sources:
    - repoURL: 'https://openbao.github.io/openbao-helm'
      chart: openbao
      targetRevision: 0.28.3
      helm:
        releaseName: openbao
        valuesObject:
          global:
            openshift: true
          injector:
            enabled: false
          server:
            standalone:
              enabled: true
              config: |
                ui = true
                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                }
                storage "file" {
                  path = "/openbao/data"
                }
            authDelegator:
              enabled: true
            dataStorage:
              enabled: true
              size: 1Gi
          ui:
            enabled: true
    - repoURL: 'https://github.com/shirodkar/app-mod-gitops.git'
      targetRevision: HEAD
      path: manifests/helm/infra
      helm: {}
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - CreateNamespace=true
  ignoreDifferences:
    - kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
