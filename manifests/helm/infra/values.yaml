openbao:
  global:
    openshift: true
  injector:
    enabled: false
  server:
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "file" {
          path = "/openbao/data"
        }
    authDelegator:
      enabled: true
    dataStorage:
      enabled: true
      size: 1Gi
  ui:
    enabled: true

appProjects:
  sharedAppProject:
    destinations:
      - namespace: '*'
        server: '*'
    namespaceResourceBlacklist:
      - group: ''
        kind: ResourceQuota
      - group: ''
        kind: LimitRange
      - group: operators.coreos.com
        kind: '*'
      - group: operator.openshift.io
        kind: '*'
      - group: storage.k8s.io
        kind: '*'
    sourceRepos:
      - '*'
    roles:
      developerGroups:
        - developers
