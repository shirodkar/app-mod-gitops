apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ .Values.vm.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.vm.name }}
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: {{ .Values.vm.name }}
        kubevirt.io/domain: {{ .Values.vm.name }}
    spec:
      domain:
        cpu:
          cores: {{ .Values.vm.cores }}
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
        resources:
          requests:
            memory: {{ .Values.vm.memory }}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: {{ .Values.vm.image }}
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              password: redhat
              chpasswd:
                expire: false
              packages:
                - postgresql-server
                - postgresql
              runcmd:
                - postgresql-setup --initdb
                - systemctl enable postgresql
                - systemctl start postgresql
                - sudo -u postgres psql -c "CREATE USER {{ .Values.database.user }} WITH PASSWORD '{{ .Values.database.password }}';"
                - sudo -u postgres psql -c "CREATE DATABASE {{ .Values.database.name }} OWNER {{ .Values.database.user }};"
                - sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ .Values.database.name }} TO {{ .Values.database.user }};"
                - sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /var/lib/pgsql/data/postgresql.conf
                - sed -i "s/peer/md5/g; s/ident/md5/g" /var/lib/pgsql/data/pg_hba.conf
                - echo "host all all 0.0.0.0/0 md5" >> /var/lib/pgsql/data/pg_hba.conf
                - systemctl restart postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.vm.name }}
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
  selector:
    app: {{ .Values.vm.name }}
  type: ClusterIP
