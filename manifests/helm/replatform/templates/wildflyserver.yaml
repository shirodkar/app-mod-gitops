apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: replatform
type: Opaque
data:
  POSTGRESQL_PASSWORD: bWFtbW90aA==
  POSTGRESQL_USER: bWFtbW90aA==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: replatform
data:
  POSTGRESQL_DATASOURCE: MammothDS
  POSTGRESQL_JNDI: 'java:jboss/datasources/MammothDS'
  POSTGRESQL_URL: 'jdbc:postgresql://postgresql-vm.rehost.svc.cluster.local:5432/mammothdb'
---
apiVersion: wildfly.org/v1alpha1
kind: WildFlyServer
metadata:
  name: mammoth
  namespace: replatform
spec:
  applicationImage: 'image-registry.openshift-image-registry.svc:5000/cicd/replatform-mammoth-eap8'
  bootableJar: false
  env:
    - name: MAMMOTH_API_URL
      value: 'http://localhost:8080/backend/api/mammoths'
  envFrom:
    - configMapRef:
        name: database-config
    - secretRef:
        name: database-secrets
  replicas: 1
