apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: replatform-pipeline-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: replatform-mammoth-eap8
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mammoth
spec:
  params:
    - name: GIT_REPO
      type: string
      default: {{ .Values.source.gitUri }}
    - name: GIT_REVISION
      type: string
      default: {{ .Values.source.gitRef }}
  workspaces:
    - name: shared-workspace
    - name: registry-credentials
  tasks:

    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.GIT_REPO)
        - name: REVISION
          value: $(params.GIT_REVISION)
        - name: DELETE_EXISTING
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-artifacts
      runAfter:
        - fetch-source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: s2i-build
            image: {{ .Values.builder.image }}
            env:
              - name: CUSTOM_INSTALL_DIRECTORIES
                value: {{ .Values.env.customInstallDirectories }}
              - name: POSTGRESQL_DRIVER_VERSION
                value: {{ .Values.env.postgresqlDriverVersion | quote }}
              - name: ARTIFACT_DIR
                value: {{ .Values.env.artifactDir }}
            script: |
              #!/bin/bash
              set -e
              echo "Preparing S2I source directory..."
              rm -rf /tmp/src
              mkdir -p /tmp/src
              cp -a $(workspaces.source.path)/. /tmp/src/
              echo "Running S2I assemble..."
              /usr/local/s2i/assemble
              echo "S2I assemble complete."
              cp -r /opt/server $(workspaces.source.path)/server
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-and-push-runtime
      runAfter:
        - build-artifacts
      taskSpec:
        workspaces:
          - name: source
          - name: credentials
        steps:
          - name: create-dockerfile
            image: {{ .Values.builder.image }}
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              cat > $(workspaces.source.path)/Dockerfile <<'DEOF'
              FROM {{ .Values.runtime.image }}
              COPY --chown=jboss:root server $JBOSS_HOME
              RUN chmod -R ug+rwX $JBOSS_HOME
              DEOF
              echo "Dockerfile created."
          - name: build-and-push
            image: {{ .Values.builder.image }}
            workingDir: $(workspaces.source.path)
            securityContext:
              capabilities:
                add:
                  - SETFCAP
            script: |
              #!/bin/bash
              set -e
              echo "Setting up registry credentials..."
              mkdir -p /home/jboss/.config/containers
              if [ -f $(workspaces.credentials.path)/.dockerconfigjson ]; then
                cp $(workspaces.credentials.path)/.dockerconfigjson /home/jboss/.config/containers/auth.json
              elif [ -f $(workspaces.credentials.path)/config.json ]; then
                cp $(workspaces.credentials.path)/config.json /home/jboss/.config/containers/auth.json
              fi
              echo "Building runtime image..."
              buildah bud --tls-verify=false \
                -t image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/replatform-mammoth-eap8:latest \
                $(workspaces.source.path)
              echo "Pushing runtime image..."
              buildah push --tls-verify=false \
                image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/replatform-mammoth-eap8:latest
              echo "Done."
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: credentials
          workspace: registry-credentials
