apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: replatform-pipeline-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: replatform-mammoth-eap8
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mammoth
spec:
  params:
    - name: GIT_REPO
      type: string
      default: {{ .Values.source.gitUri }}
    - name: GIT_REVISION
      type: string
      default: {{ .Values.source.gitRef }}
  workspaces:
    - name: shared-workspace
    - name: registry-credentials
  tasks:

    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.GIT_REPO)
        - name: REVISION
          value: $(params.GIT_REVISION)
        - name: DELETE_EXISTING
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-artifacts
      runAfter:
        - fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: s2i-java
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/replatform-mammoth-eap8-build-artifacts:latest
        - name: BUILDER_IMAGE
          value: {{ .Values.builder.image }}
        - name: TLSVERIFY
          value: "false"
        - name: PATH_CONTEXT
          value: .
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: registry-credentials

    - name: create-dockerfile
      runAfter:
        - build-artifacts
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: create-dockerfile
            image: {{ .Values.builder.image }}
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              cat > $(workspaces.source.path)/Dockerfile <<'DEOF'
              FROM {{ .Values.runtime.image }}
              COPY --chown=jboss:root server $JBOSS_HOME
              RUN chmod -R ug+rwX $JBOSS_HOME
              DEOF
              echo "Dockerfile created."
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-runtime
      runAfter:
        - create-dockerfile
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/replatform-mammoth-eap8:latest
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: registry-credentials
