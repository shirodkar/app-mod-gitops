apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: replatform-mammoth-eap8-initial
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  pipelineRef:
    name: replatform-mammoth-eap8
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: replatform-pipeline-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: replatform-mammoth-eap8
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mammoth
spec:
  params:
    - name: GIT_REPO
      type: string
      default: {{ .Values.source.gitUri }}
    - name: GIT_REVISION
      type: string
      default: {{ .Values.source.gitRef }}
  workspaces:
    - name: shared-workspace
  tasks:

    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.GIT_REPO)
        - name: REVISION
          value: $(params.GIT_REVISION)
        - name: DELETE_EXISTING
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-artifacts
      runAfter:
        - fetch-source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: s2i-build
            image: {{ .Values.builder.image }}
            env:
              - name: CUSTOM_INSTALL_DIRECTORIES
                value: {{ .Values.env.customInstallDirectories }}
              - name: POSTGRESQL_DRIVER_VERSION
                value: {{ .Values.env.postgresqlDriverVersion | quote }}
              - name: ARTIFACT_DIR
                value: {{ .Values.env.artifactDir }}
            script: |
              #!/bin/bash
              set -e
              echo "Preparing S2I source directory..."
              rm -rf /tmp/src
              mkdir -p /tmp/src
              cp -a $(workspaces.source.path)/. /tmp/src/
              echo "Running S2I assemble..."
              /usr/local/s2i/assemble
              echo "S2I assemble complete."
              cp -r /opt/server $(workspaces.source.path)/server
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-runtime
      runAfter:
        - build-artifacts
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: create-dockerfile
            image: registry.access.redhat.com/ubi8/ubi-minimal:latest
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              cat > $(workspaces.source.path)/Dockerfile <<'DEOF'
              FROM {{ .Values.runtime.image }}
              COPY --chown=jboss:root server $JBOSS_HOME
              RUN chmod -R ug+rwX $JBOSS_HOME
              DEOF
              echo "Dockerfile created."
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: push-runtime-image
      runAfter:
        - build-runtime
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/replatform-mammoth-eap8:latest
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace
