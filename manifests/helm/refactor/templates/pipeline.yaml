apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: refactor-pipeline-pvc
  namespace: cicd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: refactor-mammoth-backend
  namespace: cicd
  labels:
    app.kubernetes.io/name: mammoth-backend
spec:
  params:
    - name: GIT_REPO
      type: string
      default: {{ .Values.source.gitUri }}
    - name: GIT_REVISION
      type: string
      default: {{ .Values.source.gitRef }}
  workspaces:
    - name: shared-workspace
  tasks:

    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.GIT_REPO)
        - name: REVISION
          value: $(params.GIT_REVISION)
        - name: DELETE_EXISTING
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-app
      runAfter:
        - fetch-source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: maven-build
            image: {{ .Values.builder.image }}
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              set -e
              echo "Building Quarkus application..."
              mvn package -DskipTests
              echo "Build complete."
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-and-push-image
      runAfter:
        - build-app
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: create-dockerfile
            image: registry.access.redhat.com/ubi8/ubi-minimal:latest
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              cat > $(workspaces.source.path)/Dockerfile <<'EOF'
              FROM {{ .Values.builder.image }}
              COPY --chown=1001:0 target/quarkus-app /deployments/
              EOF
              echo "Dockerfile created."
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: push-image
      runAfter:
        - build-and-push-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/cicd/refactor-mammoth-backend:latest
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: generate-sbom
      runAfter:
        - build-app
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: syft-sbom
            image: docker.io/anchore/syft:latest
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -e
              echo "Generating SBOM with Syft..."
              syft dir:. -o cyclonedx-json > $(workspaces.source.path)/sbom.json
              echo "SBOM generated: sbom.json"
              echo "Component count:"
              cat $(workspaces.source.path)/sbom.json | grep -c '"type"' || true
          - name: upload-to-tpa
            image: registry.access.redhat.com/ubi8/ubi-minimal:latest
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              set -e
              echo "Uploading SBOM to Trusted Profile Analyzer..."
              TPA_URL="${TPA_URL:-https://tpa.apps.cluster.example.com}"
              curl -sk -X POST "$TPA_URL/api/v2/sbom" \
                -H "Content-Type: application/json" \
                -d @$(workspaces.source.path)/sbom.json \
                && echo "SBOM uploaded successfully." \
                || echo "WARN: TPA upload failed. SBOM saved locally."
            env:
              - name: TPA_URL
                value: {{ .Values.tpaUrl | default "https://tpa.apps.cluster.example.com" }}
      workspaces:
        - name: source
          workspace: shared-workspace
