apiVersion: apps/v1
kind: Deployment
metadata:
  name: mammoth-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: mammoth-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mammoth-backend
  template:
    metadata:
      labels:
        app: mammoth-backend
    spec:
      containers:
        - name: mammoth-backend
          image: image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/refactor-mammoth-backend:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgresql-vm.rehost.svc.cluster.local:5432/mammothdb
            - name: QUARKUS_DATASOURCE_USERNAME
              value: mammoth
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: mammoth
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mammoth-backend
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: mammoth-backend
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mammoth-backend
  namespace: {{ .Values.namespace }}
spec:
  to:
    kind: Service
    name: mammoth-backend
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
