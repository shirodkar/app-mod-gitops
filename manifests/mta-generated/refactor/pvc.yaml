apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mammoth-backend-source
  labels:
    helm.sh/chart: quickstart-openshift-pipelines-0.1.0
    app.kubernetes.io/name: mammoth-backend
    app.kubernetes.io/instance: mammoth-backend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/archetype: "eap8-to-quarkus"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mammoth-backend-config
  labels:
    helm.sh/chart: quickstart-openshift-pipelines-0.1.0
    app.kubernetes.io/name: mammoth-backend
    app.kubernetes.io/instance: mammoth-backend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/archetype: "eap8-to-quarkus"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
