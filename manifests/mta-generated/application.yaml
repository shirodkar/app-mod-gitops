
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mammoth
  namespace: openshift-gitops
  labels:
    helm.sh/chart: quickstart-openshift-gitops-0.1.0
    app.kubernetes.io/name: mammoth
    app.kubernetes.io/instance: mammoth
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/archetype: "eap7-to-eap8"
  annotations:
    konveyor.io/config-repository: https://github.com/shirodkar/app-mod-gitops.git
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shirodkar/app-mod-gitops.git
    targetRevision: ocp5
    path: manifests/mta-generated
  destination:
    server: https://kubernetes.default.svc
    namespace: mammoth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
