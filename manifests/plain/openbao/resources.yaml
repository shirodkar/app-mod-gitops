kind: Namespace
apiVersion: v1
metadata:
  name: openbao
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-eso-auth
  namespace: openbao
---
apiVersion: v1
kind: Secret
metadata:
  name: openbao-eso-auth-token
  namespace: openbao
  annotations:
    kubernetes.io/service-account.name: openbao-eso-auth
type: kubernetes.io/service-account-token
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: openbao
  namespace: openbao
spec:
  to:
    kind: Service
    name: openbao
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
