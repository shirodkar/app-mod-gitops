apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tpa-db-data
  namespace: trustify
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpa-db
  namespace: trustify
  labels:
    app: tpa-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpa-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tpa-db
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: trustify
            - name: POSTGRESQL_PASSWORD
              value: trustify123
            - name: POSTGRESQL_DATABASE
              value: trustify
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tpa-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: tpa-db
  namespace: trustify
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: tpa-db
  type: ClusterIP
